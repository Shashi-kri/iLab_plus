name: CI/CD Pipeline

on:
  push:
    branches: [main, fresh-backend]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11.9"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Python tests
        run: |
          cd backend
          python -m pytest tests/ || echo "No tests found"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"

      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Analyze code
        run: |
          cd frontend
          flutter analyze

      - name: Run tests
        run: |
          cd frontend
          flutter test || echo "No tests found"

  build:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3

      - name: Build success
        run: echo "Build completed successfully"

dependencies:
  http: ^1.1.0
  image_picker: ^1.0.4 # For camera/gallery
