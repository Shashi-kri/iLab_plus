name: ilab_plus_app
description: "iLab+ Eye Health - Medical eye health app with AI diagnostics"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI and Icons
  cupertino_icons: ^1.0.2

  # HTTP client for API calls
  http: ^1.1.0

  # Image picker for camera/gallery
  image_picker: ^1.0.4

  # Camera access
  camera: ^0.10.5+5

  # Permissions handling
  permission_handler: ^11.0.1

  # Path provider for cache
  pdf: ^3.10.4
  path_provider: ^2.1.1
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/images/color_blindness/

  # Note: Using system default fonts for now
  # To add custom Poppins/Roboto fonts, download from Google Fonts
  # and uncomment the fonts section below with the font files in a fonts/ directory
